# ---- Production overrides ----

# CORS: the deployed origin only, never a wildcard, never localhost.
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://library.example.com}

# Swagger is an enumerable map of your API. Off in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: health only, and no build/OS detail to anonymous callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Secure session cookie flags (relevant if you move the token off localStorage).
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Never leak the container's stack trace through the error page.
server.error.include-stacktrace=never
server.error.include-message=never

# Trust the reverse proxy's forwarded headers.
server.forward-headers-strategy=native
app.rate-limit.trust-forwarded-headers=true

logging.level.root=WARN
logging.level.com.library.lms=INFO
