spring.application.name=Library Management System

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lms}

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG

# ---- JWT ----
# Secret comes from the JWT_SECRET environment variable. No default: the app must
# refuse to boot rather than run on a predictable key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=36000000

# ---- Library policy ----
app.loan.period-days=14
app.loan.max-active-books=5

app.penalty.per-day-late=1.00
app.penalty.damaged-rate=0.5
app.penalty.lost-rate=1.0
app.penalty.default-book-price=50.00

app.hold.window-hours=48
app.hold.sweep-interval-ms=3600000

app.card.validity-months=12
app.card.enforce-expiry=true

# ---- Rate limiting (Rules.md #1) ----
# Per-IP token buckets, one tier per route class.
app.rate-limit.auth.capacity=5
app.rate-limit.auth.refill-minutes=1
app.rate-limit.public-api.capacity=30
app.rate-limit.public-api.refill-minutes=1
app.rate-limit.authenticated.capacity=100
app.rate-limit.authenticated.refill-minutes=1

# Per-account exponential backoff on failed logins.
app.rate-limit.backoff-threshold=3
app.rate-limit.backoff-base=2
app.rate-limit.max-backoff-seconds=900
app.rate-limit.failure-window-minutes=30
app.rate-limit.trust-forwarded-headers=false
